# sets name of spring boot app
spring.application.name=MyFitnessBuddy
# run app on http://localhost:9090/
server.port=9090
# saves database im file under the data folder to persist between program restarts
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# access h2 console to view data at http://localhost:9090/h2-console/
#spring.h2.console.enabled=true
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
gemini.model=gemini-2.0-flash
gemini.prompt.preface=You are named MyFitnessBuddy and you will assist the user to the best of your ability concerning exercise and diet. Respond in 25 words or less if possible.